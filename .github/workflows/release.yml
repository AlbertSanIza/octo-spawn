name: Release
on:
    push:
        branches: [main]
permissions:
    contents: write
jobs:
    release:
        runs-on: macos-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
            - name: Setup Rust
              uses: dtolnay/rust-toolchain@stable
            - name: Rust cache
              uses: swatinem/rust-cache@v2
              with:
                  workspaces: src-tauri
            - name: Install dependencies
              run: bun install
            - name: Bump version
              id: version
              run: |
                  LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
                  if [ -z "$LATEST_TAG" ]; then
                    NEW_VERSION=$(jq -r '.version' package.json)
                  else
                    VERSION=${LATEST_TAG#v}
                    IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
                    PATCH=$((PATCH + 1))
                    NEW_VERSION="$MAJOR.$MINOR.$PATCH"
                  fi
                  echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
                  echo "tag=v$NEW_VERSION" >> "$GITHUB_OUTPUT"
                  # Update version in all config files
                  jq --arg v "$NEW_VERSION" '.version = $v' package.json > tmp.json && mv tmp.json package.json
                  sed -i '' "s/^version = \".*\"/version = \"$NEW_VERSION\"/" src-tauri/Cargo.toml
                  jq --arg v "$NEW_VERSION" '.version = $v' src-tauri/tauri.conf.json > tmp.json && mv tmp.json src-tauri/tauri.conf.json
            - name: Build Tauri app
              uses: tauri-apps/tauri-action@v0
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  APPLE_SIGNING_IDENTITY: "-"
              with:
                  tagName: ${{ steps.version.outputs.tag }}
                  releaseName: ${{ steps.version.outputs.tag }}
                  releaseDraft: false
                  prerelease: false
