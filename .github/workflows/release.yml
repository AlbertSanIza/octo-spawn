name: Release
on:
    push:
        branches: [main]
permissions:
    contents: write
jobs:
    release:
        runs-on: macos-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
            - name: Setup Rust
              uses: dtolnay/rust-toolchain@stable
            - name: Rust cache
              uses: swatinem/rust-cache@v2
              with:
                  workspaces: src-tauri
            - name: Install dependencies
              run: bun install
            - name: Bump version
              id: version
              run: |
                  LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
                  if [ -z "$LATEST_TAG" ]; then
                    NEW_VERSION=$(jq -r '.version' package.json)
                  else
                    VERSION=${LATEST_TAG#v}
                    IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
                    PATCH=$((PATCH + 1))
                    NEW_VERSION="$MAJOR.$MINOR.$PATCH"
                  fi
                  echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
                  echo "tag=v$NEW_VERSION" >> "$GITHUB_OUTPUT"
                  # Update version in all config files
                  jq --arg v "$NEW_VERSION" '.version = $v' package.json > tmp.json && mv tmp.json package.json
                  sed -i '' "s/^version = \".*\"/version = \"$NEW_VERSION\"/" src-tauri/Cargo.toml
                  jq --arg v "$NEW_VERSION" '.version = $v' src-tauri/tauri.conf.json > tmp.json && mv tmp.json src-tauri/tauri.conf.json
            - name: Build Tauri app
              run: bun run tauri build
            - name: Ad-hoc sign the app
              run: codesign --force --deep --sign - "src-tauri/target/release/bundle/macos/octo-spawn.app"
            - name: Recreate DMG
              run: |
                  DMG_PATH="src-tauri/target/release/bundle/dmg"
                  rm -f "$DMG_PATH"/*.dmg
                  hdiutil create -volname "octo-spawn" -srcfolder "src-tauri/target/release/bundle/macos/octo-spawn.app" -ov -format UDZO "$DMG_PATH/octo-spawn_${{ steps.version.outputs.version }}_aarch64.dmg"
            - name: Create release
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: ${{ steps.version.outputs.tag }}
                  name: ${{ steps.version.outputs.tag }}
                  files: src-tauri/target/release/bundle/dmg/*.dmg
